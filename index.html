        // OPTIMIZED 2D Canvas Animation Component
        const NeuralNetworkAnimation = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;

                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let particles = [];

                // Config
                const particleColor = 'rgb(59, 130, 246)'; // Tailwind blue-500
                const lineColor = '59, 130, 246'; // For rgba
                const connectionDistance = 150;
                const moveSpeed = 0.5;

                const init = () => {
                    resize();
                    createParticles();
                    animate();
                };

                const resize = () => {
                    if (canvas.parentElement) {
                        canvas.width = canvas.parentElement.offsetWidth;
                        canvas.height = canvas.parentElement.offsetHeight;
                    }
                };

                const createParticles = () => {
                    const area = canvas.width * canvas.height;
                    const particleCount = Math.floor(area / 9000); // Density

                    particles = [];
                    for (let i = 0; i < particleCount; i++) {
                        particles.push({
                            x: Math.random() * canvas.width,
                            y: Math.random() * canvas.height,
                            vx: (Math.random() - 0.5) * moveSpeed,
                            vy: (Math.random() - 0.5) * moveSpeed,
                            size: Math.random() * 2 + 1
                        });
                    }
                };

                const animate = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    // Update and draw particles
                    particles.forEach((p, i) => {
                        // Move
                        p.x += p.vx;
                        p.y += p.vy;

                        // Bounce off walls
                        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                        // Draw dot
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = particleColor;
                        ctx.fill();

                        // Draw connections
                        for (let j = i + 1; j < particles.length; j++) {
                            const p2 = particles[j];
                            const dx = p.x - p2.x;
                            const dy = p.y - p2.y;
                            const dist = Math.sqrt(dx * dx + dy * dy);

                            if (dist < connectionDistance) {
                                ctx.beginPath();
                                ctx.strokeStyle = `rgba(${lineColor}, ${1 - dist / connectionDistance})`;
                                ctx.lineWidth = 1;
                                ctx.moveTo(p.x, p.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.stroke();
                            }
                        }
                    });

                    animationFrameId = requestAnimationFrame(animate);
                };

                window.addEventListener('resize', () => {
                    resize();
                    createParticles();
                });

                init();

                return () => {
                    window.removeEventListener('resize', resize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="w-full h-full" />;
        };

                                {editUser.portfolio.education_list.map((edu, i) => (
                                    <div key={i} className="barley-card relative">
                                        {isEditing && <button onClick={() => removeEducation(i)} className="absolute top-4 right-4 text-red-500 hover:text-white"><i className="ri-delete-bin-line"></i></button>}
                                        {isEditing ? (
                                            <div className="grid gap-3">
                                                <input value={edu.degree} onChange={e => updateEducation(i, 'degree', e.target.value)} className="barley-input font-bold" placeholder="Degree" />
                                                <input value={edu.institution} onChange={e => updateEducation(i, 'institution', e.target.value)} className="barley-input text-sm" placeholder="Institution" />
                                                <input value={edu.year} onChange={e => updateEducation(i, 'year', e.target.value)} className="barley-input text-xs" placeholder="Year" />
                                            </div>
                                        ) : (
                                            <>
                                                <h3 className="text-xl font-bold text-white mb-2">{edu.degree}</h3>
                                                <p className="text-gray-400">{edu.institution}</p>
                                                <p className="text-[#ff2e63] text-sm mt-2">{edu.year}</p>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section id="certification" className="py-16 border-t border-white/10">
                            <div className="flex justify-between items-center mb-10"><h2 className="text-3xl font-bold flex items-center gap-3">Certification <div className="h-1 w-20 bg-[#ff2e63]"></div></h2>{isEditing && <button onClick={addCertification} className="barley-btn barley-btn-primary text-sm">Add Item</button>}</div>
                            <div className="flex flex-wrap gap-6">
                                {editUser.portfolio.certifications_list.map((cert, i) => (
                                    <div key={i} className="barley-card relative flex-1 min-w-[300px]">
                                        {isEditing && <button onClick={() => removeCertification(i)} className="absolute top-4 right-4 text-red-500 hover:text-white"><i className="ri-delete-bin-line"></i></button>}
                                        {isEditing ? (
                                            <div className="grid gap-3">
                                                <input value={cert.name} onChange={e => updateCertification(i, 'name', e.target.value)} className="barley-input font-bold" placeholder="Certification Name" />
                                                <input value={cert.issuer} onChange={e => updateCertification(i, 'issuer', e.target.value)} className="barley-input text-sm" placeholder="Issuer" />
                                                <input value={cert.date} onChange={e => updateCertification(i, 'date', e.target.value)} className="barley-input text-xs" placeholder="Date" />
                                            </div>
                                        ) : (
                                            <div className="flex items-start gap-4">
                                                <div className="p-3 bg-white/5 rounded-full text-[#ff2e63]"><i className="ri-award-fill text-2xl"></i></div>
                                                <div>
                                                    <h3 className="text-lg font-bold text-white">{cert.name}</h3>
                                                    <p className="text-gray-400 text-sm">{cert.issuer}</p>
                                                    <p className="text-xs text-gray-500 mt-1">{cert.date}</p>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section id="contact-me" className="py-16 border-t border-white/10">
                            <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">Contact Me <div className="h-1 w-20 bg-[#ff2e63]"></div></h2>
                            <div className="grid md:grid-cols-2 gap-10">
                                <div className="barley-card">
                                    <h3 className="text-xl font-bold text-white mb-6">Get in Touch</h3>
                                    <form onSubmit={(e) => { e.preventDefault(); alert("Message functionality coming soon!") }} className="space-y-4">
                                        <div>
                                            <label className="block text-gray-400 text-sm mb-2">Name</label>
                                            <input type="text" className="barley-input w-full" placeholder="Your Name" required />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-sm mb-2">Email</label>
                                            <input type="email" className="barley-input w-full" placeholder="your@email.com" required />
                                        </div>
                                        <div>
                                            <label className="block text-gray-400 text-sm mb-2">Message</label>
                                            <textarea className="barley-textarea w-full h-32" placeholder="How can I help you?" required></textarea>
                                        </div>
                                        <button type="submit" className="barley-btn barley-btn-primary w-full py-3">Send Message</button>
                                    </form>
                                </div>
                                <div className="flex flex-col justify-center space-y-6">
                                    <div className="barley-card md:text-left text-center">
                                        <i className="ri-mail-send-fill text-4xl text-[#ff2e63] mb-4 block"></i>
                                        <h4 className="text-lg font-bold text-white mb-2">Email</h4>
                                        <p className="text-gray-400">{editUser.portfolio.contact.email || "No email provided"}</p>
                                    </div>
                                    <div className="barley-card md:text-left text-center">
                                        <i className="ri-linkedin-box-fill text-4xl text-[#ff2e63] mb-4 block"></i>
                                        <h4 className="text-lg font-bold text-white mb-2">LinkedIn</h4>
                                        <p className="text-gray-400">{editUser.portfolio.contact.linkedin ? "Available" : "Not connected"}</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                        <footer className="text-center text-gray-500 mt-20 text-sm">&copy; 2024 {editUser.username}. Designed with Lead AI.</footer>
                    </div>
                </div>
            );
        };

        // Footer Component (Global)
        const Footer = () => (
            <footer className="border-t border-slate-800 relative z-10 bg-transparent">
                <div className="container mx-auto px-6 py-8 text-center text-slate-400">
                    <p>&copy; 2024 Lead AI. All rights reserved.</p>
                    <p className="text-sm text-slate-500 mt-2">Forging the future of AI excellence.</p>
                </div>
            </footer>
        );

        // --- MAIN APP COMPONENT ---
        const Notification = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return (
                <div className={`fixed bottom-8 right-8 z-[100] px-6 py-4 rounded-lg shadow-2xl border backdrop-blur-md transition-all duration-300 transform translate-y-0 ${type === 'success' ? 'bg-green-900/80 border-green-500 text-green-100' : 'bg-red-900/80 border-red-500 text-red-100'
                    }`}>
                    <div className="flex items-center gap-3">
                        {type === 'success' ? (
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                        ) : (
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        )}
                        <p className="font-medium">{message}</p>
                        <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100">&times;</button>
                    </div>
                </div>
            );
        };

        const HomePage = () => (
            <>
                <Hero />
                <Mission />
                <Pillars />
                <FoundingMembers />
            </>
        );

        const NotFoundPage = () => (
            <div className="min-h-screen flex items-center justify-center text-center">
                <div>
                    <h1 className="text-6xl font-bold hero-gradient-text">404</h1>
                    <p className="text-2xl mt-4 text-slate-300">User Not Found</p>
                    <Link to="#/community" className="mt-8 inline-block bg-slate-100 text-slate-900 font-bold px-8 py-4 rounded-lg text-lg hover:bg-slate-200 transition-transform duration-300 hover:scale-105">Back to Community</Link>
                </div>
            </div>
        );

        const hydrateUser = (dbUser) => {
            const defaultPortfolio = {
                tagline: "AI Enthusiast & Lifelong Learner",
                about_me: `Hello, I'm ${dbUser.username}.`,
                profile_image_url: '',
                contact: { email: '', phone: '', location: '', linkedin: '', github: '', website: '' },
                skills_list: [],
                projects: [],
                experience_list: [],
                education_list: [],
                certifications_list: [],
            };

            const portfolio = dbUser.portfolio || {};
            const hydratedPortfolio = {
                ...defaultPortfolio,
                ...portfolio,
                contact: { ...defaultPortfolio.contact, ...(portfolio.contact || {}) },
                skills_list: Array.isArray(portfolio.skills_list) ? portfolio.skills_list : [],
                projects: Array.isArray(portfolio.projects) ? portfolio.projects : [],
                experience_list: Array.isArray(portfolio.experience_list) ? portfolio.experience_list : [],
                education_list: Array.isArray(portfolio.education_list) ? portfolio.education_list : [],
                certifications_list: Array.isArray(portfolio.certifications_list) ? portfolio.certifications_list : [],
                profile_image_url: portfolio.profile_image_url || `https://i.pravatar.cc/150?u=${dbUser.id}`,
            };

            return {
                id: dbUser.id,
                username: dbUser.username || 'Unknown',
                email: dbUser.email || '',
                portfolio: hydratedPortfolio,
            };
        };

        const App = () => {
            const [authModal, setAuthModal] = useState({ isOpen: false, view: 'login' });
            const [users, setUsers] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);
            const [route, setRoute] = useState(window.location.hash);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);

            const showNotification = (message, type) => {
                setNotification({ message, type });
            };

            useEffect(() => {
                const initApp = async () => {
                    const storedUserStr = localStorage.getItem('lead_ai_user');
                    if (storedUserStr) {
                        try {
                            const storedUser = JSON.parse(storedUserStr);
                            const { data } = await supabase.from('profiles').select('id, username, email, portfolio').eq('id', storedUser.id).single();
                            if (data) {
                                setCurrentUser(hydrateUser(data));
                            } else {
                                localStorage.removeItem('lead_ai_user');
                            }
                        } catch (e) {
                            localStorage.removeItem('lead_ai_user');
                        }
                    }
                    await fetchCommunity();
                    setLoading(false);
                };
                initApp();
            }, []);

            const fetchCommunity = async () => {
                const { data, error } = await supabase.from('profiles').select('id, username, email, portfolio');
                if (!error && data) {
                    setUsers(data.map(hydrateUser));
                }
            };

            useEffect(() => {
                const handleHashChange = () => setRoute(window.location.hash);
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            const handleRegister = useCallback(async (username, email, password) => {
                try {
                    const { data: existingUsers } = await supabase.from('profiles').select('email').eq('email', email);
                    if (existingUsers && existingUsers.length > 0) return { success: false, message: "User already registered. Please login." };

                    const newId = crypto.randomUUID();
                    const newPortfolio = {
                        tagline: "AI Enthusiast & Lifelong Learner",
                        about_me: `Hello, I'm ${username}. I'm new here!`,
                        profile_image_url: `https://i.pravatar.cc/150?u=${newId}`,
                        contact: { email, phone: '', location: '', linkedin: '', github: '', website: '' },
                        skills_list: ['AI', 'Machine Learning'],
                        projects: [],
                        experience_list: [],
                        education_list: [],
                    };

                    const { error: insertError } = await supabase.from('profiles').insert([{ id: newId, username: username, email: email, pass: password, portfolio: newPortfolio }]);
                    if (insertError) return { success: false, message: insertError.message };

                    const newUser = hydrateUser({ id: newId, username, email, portfolio: newPortfolio });
                    setCurrentUser(newUser);
                    localStorage.setItem('lead_ai_user', JSON.stringify(newUser));
                    setAuthModal({ isOpen: false, view: 'login' });
                    showNotification("Registration successful! Welcome aboard.", 'success');
                    await fetchCommunity();
                    setTimeout(() => { window.location.hash = `#/profile/${username}`; }, 100);
                    return { success: true };
                } catch (e) {
                    return { success: false, message: e.message || "Unexpected error occurred" };
                }
            }, []);

            const handleLogin = useCallback(async (email, password) => {
                try {
                    const { data, error } = await supabase.from('profiles').select('id, username, email, portfolio').eq('email', email).eq('pass', password);
                    if (error) return { success: false, message: error.message };
                    if (!data || data.length === 0) return { success: false, message: "User not registered. Please check email and password or sign up." };

                    const user = hydrateUser(data[0]);
                    setCurrentUser(user);
                    localStorage.setItem('lead_ai_user', JSON.stringify(user));
                    setAuthModal({ isOpen: false, view: 'login' });
                    showNotification("Successfully logged in!", 'success');
                    return { success: true };
                } catch (e) {
                    return { success: false, message: "An unexpected error occurred." };
                }
            }, []);

            const handleLogout = useCallback(async () => {
                localStorage.removeItem('lead_ai_user');
                setCurrentUser(null);
                window.location.hash = '#';
                showNotification("Logged out successfully", 'success');
            }, []);

            const handleUpdateUser = useCallback(async (currentUsername, updates) => {
                if (!currentUser) return false;
                const updatedProfile = { username: updates.username || currentUser.username, portfolio: { ...currentUser.portfolio, ...updates.portfolio } };
                const { error } = await supabase.from('profiles').update({ username: updatedProfile.username, portfolio: updatedProfile.portfolio }).eq('id', currentUser.id);

                if (error) {
                    showNotification("Failed to save changes. Please try again.", 'error');
                    return false;
                } else {
                    const newUserData = { ...currentUser, ...updatedProfile };
                    setCurrentUser(newUserData);
                    localStorage.setItem('lead_ai_user', JSON.stringify(newUserData));
                    showNotification("Profile updated successfully!", 'success');
                    await fetchCommunity();
                    if (updates.username && updates.username !== currentUsername) window.location.hash = `#/profile/${updates.username}`;
                    return true;
                }
            }, [currentUser]);

            const renderPage = () => {
                if (loading) return <div className="h-screen flex items-center justify-center text-white">Loading Community...</div>;
                const path = route.replace(/^#\/?/, '').split('/');
                const page = path[0] || 'home';
                const param = path[1];

                if (page === 'community') return <CommunityPage users={users} />;
                if (page === 'profile' && param) {
                    const userToView = users.find(u => u.username.toLowerCase() === param.toLowerCase());
                    return userToView ? <PortfolioPage user={userToView} currentUser={currentUser} onUpdate={handleUpdateUser} /> : <NotFoundPage />;
                }
                return <HomePage />;
            };

            return (
                <>
                    <div className="glow-effect"></div>
                    {/* Conditionally render Header: Show on non-profile pages OR if owner is viewing their own profile */}
                    {(!route.startsWith('#/profile') || (currentUser && route.includes(currentUser.username))) && (
                        <Header currentUser={currentUser} onLoginClick={() => setAuthModal({ isOpen: true, view: 'login' })} onRegisterClick={() => setAuthModal({ isOpen: true, view: 'register' })} onLogout={handleLogout} />
                    )}
                    <main>{renderPage()}</main>
                    {/* Conditionally render Footer: Same logic as Header */}
                    {(!route.startsWith('#/profile') || (currentUser && route.includes(currentUser.username))) && <Footer />}
                    {authModal.isOpen && <AuthModal initialView={authModal.view} onRegister={handleRegister} onLogin={handleLogin} onClose={() => setAuthModal({ isOpen: false, view: 'login' })} />}
                    {notification && <Notification message={notification.message} type={notification.type} onClose={() => setNotification(null)} />}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
